<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C13 Shoot</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <div class="logo-badge">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
          <circle cx="12" cy="13" r="4"></circle>
        </svg>
      </div>
      <div>
        <h1>C13 Shoot <span class="pro-pill">PRO</span></h1>
        <p class="subtitle">100% Gratis &bull; Open Source</p>
      </div>
    </div>
    <div class="header-actions">
      <button id="reload-ext-btn" class="icon-btn" title="Recargar extensión (Aplicar cambios)">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
      <button id="open-studio-btn" class="icon-btn" title="Abrir Estudio / Pegar Imagen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Tabs: Capturar vs Grabar -->
  <nav class="mode-tabs">
    <button class="tab-btn active" data-tab="capture">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <path d="M21 15l-5-5L5 21"/>
      </svg>
      Capturar Pantalla
    </button>
    <button class="tab-btn" data-tab="record">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <polygon points="23 7 16 12 23 17 23 7"></polygon>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
      </svg>
      Grabar Vídeo
    </button>
  </nav>

  <!-- PANEL 1: CAPTURA DE PANTALLA -->
  <main id="tab-capture" class="tab-content active">
    <div class="action-cards">
      <button id="btn-capture-visible" class="capture-card">
        <div class="card-icon blue">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div class="card-info">
          <span class="card-title">Parte visible</span>
          <span class="card-desc">Captura lo que ves ahora mismo</span>
        </div>
        <kbd class="shortcut">Alt+Shift+V</kbd>
      </button>

      <button id="btn-capture-area" class="capture-card">
        <div class="card-icon purple">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2v14a2 2 0 0 0 2 2h14"></path>
            <path d="M18 22V8a2 2 0 0 0-2-2H2"></path>
          </svg>
        </div>
        <div class="card-info">
          <span class="card-title">Seleccionar área</span>
          <span class="card-desc">Arrastra para recortar una zona exacta</span>
        </div>
        <kbd class="shortcut">Alt+Shift+S</kbd>
      </button>

      <button id="btn-capture-full" class="capture-card featured">
        <div class="card-icon emerald">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="12" y1="18" x2="12" y2="12"></line>
            <polyline points="9 15 12 18 15 15"></polyline>
          </svg>
        </div>
        <div class="card-info">
          <span class="card-title">Página completa <span class="badge-free">Auto-Scroll</span></span>
          <span class="card-desc">Captura toda la web de arriba a abajo</span>
        </div>
        <kbd class="shortcut">Alt+Shift+F</kbd>
      </button>
    </div>

    <div class="options-bar">
      <div class="option-row">
        <label for="capture-delay">Retraso antes de capturar:</label>
        <div class="delay-pills" id="delay-selector">
          <button type="button" class="pill active" data-delay="0">0s</button>
          <button type="button" class="pill" data-delay="3">3s</button>
          <button type="button" class="pill" data-delay="5">5s</button>
        </div>
      </div>
      <div class="option-row">
        <label for="after-capture">Al terminar captura:</label>
        <select id="after-capture" class="clean-select">
          <option value="editor">Abrir editor de anotaciones</option>
          <option value="download">Descargar PNG directamente</option>
        </select>
      </div>
    </div>

    <div id="status-msg" class="status-banner hidden"></div>
  </main>

  <!-- PANEL 2: GRABADOR DE VÍDEO PRO -->
  <section id="tab-record" class="tab-content">
    <div class="record-config">
      <div class="config-item">
        <label>Calidad de vídeo (Sin límites)</label>
        <select id="video-quality" class="clean-select">
          <option value="4k">4K Ultra HD (2160p &bull; 60 FPS)</option>
          <option value="1080p" selected>Full HD (1080p &bull; 60 FPS)</option>
          <option value="720p">HD Ligero (720p &bull; 30 FPS)</option>
        </select>
      </div>

      <div class="config-toggles">
        <label class="toggle-row">
          <span>Grabar micrófono</span>
          <input type="checkbox" id="rec-mic" checked />
        </label>
        <label class="toggle-row">
          <span>Audio del sistema / pestaña</span>
          <input type="checkbox" id="rec-sys-audio" checked />
        </label>
        <label class="toggle-row">
          <span>Cuenta atrás de 3 segundos</span>
          <input type="checkbox" id="rec-countdown" checked />
        </label>
      </div>

      <button id="btn-open-recorder" class="primary-record-btn">
        <span class="rec-dot"></span>
        Abrir Estudio de Grabación Pro
      </button>
      <p class="record-hint">Sin marcas de agua, sin límite de minutos, descarga instantánea en WebM/MP4.</p>
    </div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
